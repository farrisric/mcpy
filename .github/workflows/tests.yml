name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install package and test dependencies
        # The test suite needs neither mace-torch nor torch, so the GPU
        # extras stay out.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run tests
        run: pytest tests/ -v --cov=mcpy --cov-report=term-missing

  examples:
    # Smoke run of the CPU-only starter examples (ASE potentials, seconds each).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run CPU examples
        working-directory: examples
        run: |
          python 00_hello_gcmc.py
          python 01_canonical_mc.py
          python 02_molecule_gcmc.py

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-quotes

      # All tracked Python files; config lives in .flake8.
      - name: Lint
        run: flake8 $(git ls-files '*.py')
